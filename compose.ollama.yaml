services:
  studio:
    environment:
      OLLAMA_ENABLED: "1"
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    init: true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  ollama-models:
